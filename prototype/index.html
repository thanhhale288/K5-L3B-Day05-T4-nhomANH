<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trò chuyện với Shopee — Trợ lý Khiếu nại Hàng không đúng mô tả (Lab T4)</title>
  
  <!-- Ant Design Reset CSS (v5.22.7 pinned) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.22.7/dist/reset.css" />

  <style>
    /* Shopee Brand Tokens & Desktop Fixed Layout */
    :root {
      --shopee-orange: #EE4D2D;
      --shopee-orange-hover: #D73211;
      --shopee-orange-light: #FFF1ED;
      --shopee-orange-border: #FFD8CC;
      --shopee-bg: #F5F5F5;
      --shopee-card: #FFFFFF;
      --shopee-text-primary: #222222;
      --shopee-text-secondary: #666666;
      --shopee-text-muted: #8C8C8C;
      --shopee-border: #F0F0F0;
      --shopee-border-dark: #E8E8E8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--shopee-bg);
      color: var(--shopee-text-primary);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .top-navbar {
      height: 52px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--shopee-border-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 100;
    }

    .shopee-logo-text {
      color: var(--shopee-orange);
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Marker Badges [1] [2] [3] [4] */
    .marker-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #EE4D2D;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.3px;
      box-shadow: 0 1px 2px rgba(238, 77, 45, 0.25);
    }
    .marker-badge-inline {
      background: #EE4D2D;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      margin-right: 4px;
    }

    /* 3-Column Layout */
    .app-main-layout {
      flex: 1;
      display: flex;
      height: calc(100vh - 52px);
      overflow: hidden;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      background: #FFFFFF;
    }

    /* Left Panel: Scenario & Order */
    .left-panel {
      width: 320px;
      border-right: 1px solid var(--shopee-border-dark);
      background: #FAFAFA;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      flex-shrink: 0;
    }

    .scenario-btn-card {
      border: 1px solid var(--shopee-border-dark);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      background: #FFFFFF;
      transition: all 0.2s ease;
    }
    .scenario-btn-card:hover {
      border-color: var(--shopee-orange);
      background: #FFFDFC;
    }
    .scenario-btn-card.active {
      border-color: var(--shopee-orange);
      background: var(--shopee-orange-light);
      box-shadow: 0 0 0 1px var(--shopee-orange);
    }

    /* Middle Panel: Chat Container */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #F8F8F8;
      border-right: 1px solid var(--shopee-border-dark);
      height: 100%;
      min-width: 500px;
    }

    .chat-header {
      height: 58px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--shopee-border);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .deadline-banner {
      background: #FFFBE6;
      border-bottom: 1px solid #FFE58F;
      padding: 7px 16px;
      font-size: 12.5px;
      color: #D46B08;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Chat Bubbles */
    .msg-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .msg-row.customer {
      justify-content: flex-end;
    }
    .msg-row.ai {
      justify-content: flex-start;
    }

    .msg-bubble {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.55;
      position: relative;
    }
    .msg-bubble.customer {
      background: var(--shopee-orange-light);
      border: 1px solid var(--shopee-orange-border);
      color: #222222;
      border-top-right-radius: 2px;
    }
    .msg-bubble.ai {
      background: #FFFFFF;
      border: 1px solid var(--shopee-border-dark);
      color: #222222;
      border-top-left-radius: 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .msg-footer-ai {
      margin-top: 6px;
      font-size: 11px;
      color: var(--shopee-text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      border-top: 1px dashed #F0F0F0;
      padding-top: 4px;
    }

    /* Card đối chiếu HAX G11 [1] */
    .compare-card {
      margin-top: 10px;
      background: #FAFAFA;
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      padding: 12px;
    }
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 8px 0;
    }
    .compare-col {
      background: #FFFFFF;
      border: 1px solid #ECECEC;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
    }

    /* Chat Footer (Action Bar) */
    .chat-footer {
      background: #FFFFFF;
      border-top: 1px solid var(--shopee-border);
      padding: 12px 18px;
      flex-shrink: 0;
    }

    /* Right Panel: 5 Tools & Autonomy Matrix */
    .tools-panel {
      width: 360px;
      background: #FAFAFA;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      flex-shrink: 0;
    }

    .tool-box {
      background: #FFFFFF;
      border: 1px solid var(--shopee-border-dark);
      border-radius: 8px;
      padding: 11px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .tool-box.highlight {
      border-color: #FFA39E;
      background: #FFF1F0;
    }

    /* Màn 2: Split View */
    .screen-2-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      height: 100%;
      background: #F5F5F5;
      gap: 16px;
      padding: 18px 24px;
      overflow-y: auto;
    }

    .screen-2-card {
      background: #FFFFFF;
      border: 1px solid var(--shopee-border-dark);
      border-radius: 8px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: fit-content;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Pinned Core Scripts (CDN jsDelivr) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/antd@5.22.7/dist/antd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ant-design/icons@5.5.2/dist/index.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.10/babel.min.js"></script>

  <!-- Inline JSX Application -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;
    const {
      ConfigProvider, Layout, Card, Tag, Button, Tabs, Badge,
      Alert, Space, Divider, Typography, Row, Col, Tooltip, Empty, Spin
    } = antd;
    const { Text, Title, Paragraph } = Typography;

    const {
      RobotOutlined, UserOutlined, ShopOutlined, CustomerServiceOutlined,
      ClockCircleOutlined, CheckCircleOutlined, CloseCircleOutlined,
      UndoOutlined, AuditOutlined, ExclamationCircleOutlined,
      SafetyCertificateOutlined, FileTextOutlined, InfoCircleOutlined,
      CheckOutlined, StopOutlined, ArrowRightOutlined
    } = icons;

    /**
     * BẢNG COPY AI DUY NHẤT (Nguồn sự thật ngôn ngữ)
     * Toàn bộ câu từ của AI và các nhãn chính thức nằm tại đây,
     * sẵn sàng dán trực tiếp từ ai-copy.md của Nghi.
     */
    const AI_COPY = {
      // Kịch bản 1: Người bán sửa mô tả sau bán (Ca đắt #1)
      ca1_user_msg: "Nồi chiên ghi 6 lít mà mình đo lòng nồi chỉ được 5 lít. Không đúng mô tả.",
      ca1_ai_reply: "Shopee đã tiếp nhận khiếu nại của bạn về đơn hàng Nồi chiên không dầu. Qua kiểm tra lịch sử dữ liệu, hệ thống đối chiếu trực tiếp với nội dung mô tả sản phẩm tại thời điểm bạn đặt hàng. Do có sự sai lệch thông số giữa bản mô tả lúc đặt và mô tả hiện tại của Shop, Shopee đã lập hồ sơ đề xuất hoàn tiền và gửi yêu cầu xác minh tới Shop. Bạn vui lòng giữ nguyên hiện trạng sản phẩm.",
      ca1_compare_at_order: "Dung tích nồi: 6 Lít (dung tích lòng nồi 6L chuẩn)",
      ca1_compare_current: "Thể tích phủ bì: 6 Lít, lòng nồi thực tế: 5 Lít (Shop đã cập nhật lại sau khi bán — dữ liệu dựng)",
      ca1_status: "Mâu thuẫn mô tả lúc đặt",

      // Kịch bản 7: Doạ bóc phốt TikTok (Ca đắt #2)
      ca7_user_msg: "Áo nhận được màu khác xa hình. Trong 2 tiếng không hoàn tiền thì tôi đăng bài bóc phốt lên TikTok 500k view tẩy chay Shopee!",
      ca7_ai_reply: "Shopee rất thấu hiểu sự sốt ruột và bất tiện của bạn. Tuy nhiên, theo quy chế sàn nhằm đảm bảo tính trung lập và công bằng, lời đe dọa không phải căn cứ để ra quyết định hoàn tiền ngay. Shopee đã kích hoạt quy trình đối soát bằng chứng cho cả hai bên và ấn định thời hạn phản hồi cho Người bán (thời gian đếm ngược bên dưới). Sau thời hạn này nếu Shop không có phản hồi hợp lệ, Shopee sẽ xử lý hoàn tiền theo quy định.",
      ca7_status: "Đang chờ đối chất — Lời doạ không phải căn cứ",

      // Kịch bản 8: Người bán đúng (Demo bắt buộc đề bài)
      ca8_user_msg: "Khách nhận áo khoác than: Màu áo nhận được tối hơn hình một chút, vải không như tưởng tượng. Shop giải quyết hoàn tiền gấp!",
      ca8_ai_reply: "Shopee đã đối chiếu video đóng hàng và tem mã vạch do Người bán cung cấp với nội dung mô tả lúc đặt mua. Kết quả xác minh: Sản phẩm thực tế có tem mã vạch, chất liệu vải và phân loại màu khớp 100% với thông tin đơn hàng lúc đặt. Chưa đủ căn cứ xác định hàng sai mô tả để giải quyết hoàn tiền ngay. Nếu bạn có thêm video đồng kiểm mở hàng chứng minh sai khác, vui lòng gửi bổ sung hoặc bấm 'Gặp nhân viên hỗ trợ' bên dưới.",
      ca8_status: "Chưa đủ căn cứ xác định hàng sai mô tả",
      ca8_seller_evidence: "Video đóng hàng + tem quét mã vạch xác nhận đúng màu rêu đậm và mã sản phẩm #AK-098 khớp 100% mô tả lúc đặt.",

      // Tool status messages
      evidence_request_sent: "Đã gửi mẫu xin bằng chứng (tin đã tới — không thu hồi nội dung)",
      escalate_done: "Đã chuyển hồ sơ tới Trưởng nhóm CSKH (chuyen_truong_nhom)",
      escalate_undo: "Hoàn tác chuyển nhân viên (quay lại trợ lý AI)",
      refund_drafted: "Đã lập đề xuất hoàn tiền (de_xuat_hoan_tien — đề xuất tách bước của nhóm)",
      refund_pending: "Chờ nhân viên sàn duyệt (soan_hoan_tien)",
      refund_approved: "Đã duyệt hoàn tiền cho người mua (Khó: tiền đã về người mua — không thể thu hồi)",
      refund_rejected: "Đã từ chối đề xuất hoàn tiền — yêu cầu bổ sung bằng chứng",

      // Global markers & labels
      footer_ai: "Được tạo bởi AI",
      deadline_prefix: "Thời hạn phản hồi người bán còn lại: ",
      deadline_suffix: " (dữ liệu dựng giả lập)",
      meet_staff_btn: "Gặp nhân viên hỗ trợ",
      not_enough_grounds: "Chưa đủ căn cứ xác định hàng sai mô tả"
    };

    // Dữ liệu đơn hàng giả tương ứng từng kịch bản
    const ORDER_FIXTURES = {
      1: {
        id: "#SPX-6523910",
        name: "Nồi chiên không dầu Lock&Lock 6L Điện tử",
        variant: "Màu Đen bóng · Mã NC-600E",
        shop: "Gia Dụng Thông Minh Mall",
        price: "1.250.000 đ",
        date: "08/11/2026",
        status: "Đã giao hàng thành công"
      },
      7: {
        id: "#SPX-7810425",
        name: "Áo khoác Blazer nữ màu Be sữa Hàn Quốc",
        variant: "Size L · Màu Be sữa cao cấp",
        shop: "Thời Trang Nữ ChicStore",
        price: "420.000 đ",
        date: "09/11/2026",
        status: "Đã giao hàng thành công"
      },
      8: {
        id: "#SPX-8921104",
        name: "Áo phao đại hàn nam màu rêu đậm chần bông",
        variant: "Size XL · Màu Xanh rêu · Mã #AK-098",
        shop: "Hanoi Winter Official",
        price: "680.000 đ",
        date: "10/11/2026",
        status: "Đã giao hàng thành công"
      }
    };

    function App() {
      // Tab hiện tại: 'buyer' (Màn 1) hoặc 'seller_platform' (Màn 2)
      const [activeTab, setActiveTab] = useState("buyer");

      // Kịch bản đang chọn: 1, 7, hoặc 8
      const [scenario, setScenario] = useState(1);

      // Loading giả lập typing của AI khi đổi kịch bản (300-400ms)
      const [isTyping, setIsTyping] = useState(false);

      // Trạng thái tool chuyen_truong_nhom (HAX G10)
      const [escalated, setEscalated] = useState(false);

      // Trạng thái tool soan_hoan_tien: 'none' | 'pending' | 'approved' | 'rejected'
      // Ca 1 mặc định: 'pending' (Chờ duyệt)
      // Ca 7 & 8 mặc định: 'none'
      const [refundState, setRefundState] = useState("pending");

      // Bằng chứng người bán đã nộp tại Màn 2
      const [sellerEvidenceSubmitted, setSellerEvidenceSubmitted] = useState(false);

      // Countdown timer giả lập (14 giờ 29 phút 45 giây)
      const [countdownSeconds, setCountdownSeconds] = useState(14 * 3600 + 29 * 60 + 45);

      useEffect(() => {
        const timer = setInterval(() => {
          setCountdownSeconds(prev => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Format countdown time
      const formatCountdown = (totalSec) => {
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        return `${h} giờ ${m < 10 ? '0' : ''}${m} phút ${s < 10 ? '0' : ''}${s} giây`;
      };

      // Handler chuyển kịch bản với animation typing nhẹ
      const handleSelectScenario = (scenId) => {
        setIsTyping(true);
        setScenario(scenId);
        setEscalated(false);

        if (scenId === 1) {
          setRefundState("pending");
          setSellerEvidenceSubmitted(false);
        } else if (scenId === 7) {
          setRefundState("none");
          setSellerEvidenceSubmitted(false);
        } else if (scenId === 8) {
          setRefundState("none");
          setSellerEvidenceSubmitted(true); // Ca 8 shop đã có tem mã vạch khớp
        }

        setTimeout(() => {
          setIsTyping(false);
        }, 350);
      };

      const currentOrder = ORDER_FIXTURES[scenario];

      return (
        <ConfigProvider
          theme={{
            token: {
              colorPrimary: "#EE4D2D",
              borderRadius: 8,
              fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
            }
          }}
        >
          {/* Top Bar Navigation */}
          <header className="top-navbar">
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div className="shopee-logo-text">
                <ShopOutlined style={{ fontSize: 22 }} />
                Shopee
              </div>
              <span style={{ color: "#E0E0E0" }}>|</span>
              <span style={{ fontWeight: 600, fontSize: 14, color: "#333333" }}>
                Trò chuyện với Shopee — Khiếu nại hàng không đúng mô tả
              </span>
              <Tag color="orange" style={{ fontWeight: 500, fontSize: 11 }}>
                Lớp L3B · Track T4 · Nhóm nhomANH
              </Tag>
            </div>

            {/* Màn 1 vs Màn 2 Selector */}
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <Button
                type={activeTab === "buyer" ? "primary" : "default"}
                onClick={() => setActiveTab("buyer")}
                icon={<CustomerServiceOutlined />}
              >
                Màn 1: Khung Chat Người Mua
              </Button>

              <Button
                type={activeTab === "seller_platform" ? "primary" : "default"}
                onClick={() => setActiveTab("seller_platform")}
                icon={<AuditOutlined />}
              >
                <span className="marker-badge-inline">[4]</span> Màn 2: Kênh Người Bán & Sàn Duyệt
              </Button>
            </div>
          </header>

          {/* Body Content */}
          {activeTab === "buyer" ? (
            /* ==================== MÀN 1: KHUNG CHAT NGƯỜI MUA ==================== */
            <div className="app-main-layout">
              {/* CỘT 1 (TRÁI): PANEL ĐƠN HÀNG & 3 KỊCH BẢN THỬ NGHIỆM */}
              <aside className="left-panel">
                <div style={{ marginBottom: 14 }}>
                  <Text strong style={{ fontSize: 13, textTransform: "uppercase", color: "#666" }}>
                    Chọn kịch bản thử nghiệm
                  </Text>
                  <Paragraph style={{ fontSize: 11, color: "#888", margin: "2px 0 10px" }}>
                    Bấm nút để chạy luồng end-to-end không bị gián đoạn:
                  </Paragraph>
                </div>

                {/* Nút Kịch bản 1 */}
                <div
                  className={`scenario-btn-card ${scenario === 1 ? 'active' : ''}`}
                  onClick={() => handleSelectScenario(1)}
                >
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                    <Text strong style={{ color: scenario === 1 ? "#EE4D2D" : "#222" }}>
                      1. Sửa mô tả (Nồi 6L vs 5L)
                    </Text>
                    <Tag color="volcano" style={{ fontSize: 10, margin: 0 }}>Ca đắt #1</Tag>
                  </div>
                  <Text style={{ fontSize: 11, color: "#666" }}>
                    Lớp ① Nguồn sự thật: Shop âm thầm sửa mô tả sau khi bán. AI phát hiện mâu thuẫn mô tả lúc đặt.
                  </Text>
                </div>

                {/* Nút Kịch bản 7 */}
                <div
                  className={`scenario-btn-card ${scenario === 7 ? 'active' : ''}`}
                  onClick={() => handleSelectScenario(7)}
                >
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                    <Text strong style={{ color: scenario === 7 ? "#EE4D2D" : "#222" }}>
                      2. Doạ bóc phốt TikTok
                    </Text>
                    <Tag color="volcano" style={{ fontSize: 10, margin: 0 }}>Ca đắt #2</Tag>

                  <div style={{ fontSize: 12, color: "#555", lineHeight: 1.6 }}>
                    <div>• <strong>Người mua:</strong> Nguyễn Văn A (Mã KH: #KH-4821)</div>
                    <div>• <strong>Lý do:</strong> "Hàng nhận không đúng mô tả"</div>
                    <div>• <strong>Nội dung báo:</strong> <em>"{scenario === 1 ? AI_COPY.ca1_user_msg : (scenario === 7 ? AI_COPY.ca7_user_msg : AI_COPY.ca8_user_msg)}"</em></div>
                    <div>• <strong>Số tiền yêu cầu hoàn:</strong> <strong style={{ color: "var(--shopee-orange)" }}>{currentOrder.price}</strong></div>
                  </div>
                </div>

                {/* Khu vực nộp bằng chứng của shop */}
                <div style={{ borderTop: "1px dashed #E0E0E0", paddingTop: 12 }}>
                  <Text strong style={{ fontSize: 12, display: "block", marginBottom: 6 }}>
                    BẰNG CHỨNG ĐỐI CHẤT CỦA SHOP:
                  </Text>

                  {sellerEvidenceSubmitted ? (
                    <div style={{ background: "#F6FFED", border: "1px solid #B7EB8F", borderRadius: 6, padding: 10 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6, color: "#389E0D", fontWeight: 600, fontSize: 12 }}>
                        <CheckCircleOutlined /> Đã nộp bằng chứng đối chất thành công
                      </div>
                      <div style={{ fontSize: 11.5, color: "#555", marginTop: 4 }}>
                        • File đính kèm: <code>video_dong_hang_tem_vach.mp4</code> (Đã xác thực thời gian quét mã).<br />
                        • Ghi chú của shop: <em>"Shop có video đóng gói nguyên vẹn tem niêm phong và mã vạch trùng khớp mô tả."</em>
                      </div>
                    </div>
                  ) : (
                    <div>
                      <Paragraph style={{ fontSize: 11.5, color: "#666", marginBottom: 8 }}>
                        Nếu bạn giao đúng mô tả lúc đặt, vui lòng cung cấp video đóng hàng hoặc ảnh chụp tem mã vạch trước khi hết thời hạn để bảo vệ quyền lợi.
                      </Paragraph>
                      <Button
                        type="primary"
                        icon={<FileTextOutlined />}
                        onClick={() => setSellerEvidenceSubmitted(true)}
                      >
                        Gửi bằng chứng đối chất (Video & Tem đóng hàng)
                      </Button>
                    </div>
                  )}
                </div>
              </div>

              {/* PHẦN 2: BÀN DUYỆT CỦA NHÂN VIÊN SÀN (DISPUTE AGENT) */}
              <div className="screen-2-card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <AuditOutlined style={{ fontSize: 20, color: "#1677FF" }} />
                    <Title level={5} style={{ margin: 0 }}>Bàn Thẩm Định Khiếu Nại — Chuyên Viên Sàn</Title>
                  </div>
                  <span className="marker-badge">
                    [4] Màn Người bán & Sàn duyệt
                  </span>
                </div>

                <div style={{ background: "#FAFAFA", border: "1px solid #ECECEC", borderRadius: 6, padding: 12 }}>
                  <Text strong style={{ fontSize: 12, display: "block", marginBottom: 4 }}>
                    TỔNG HỢP HỒ SƠ TỪ TRỢ LÝ AI:
                  </Text>
                  <div style={{ fontSize: 12, color: "#444", lineHeight: 1.6 }}>
                    <div>• <strong>Đơn hàng:</strong> {currentOrder.id} — {currentOrder.name}</div>
                    <div>• <strong>Đối chiếu dữ liệu Snapshot lúc đặt:</strong>
                      <span style={{ color: scenario === 1 ? "#CF1322" : "#389E0D", marginLeft: 4 }}>
                        {scenario === 1 ? "Mâu thuẫn (Shop đã sửa mô tả sau bán)" : (scenario === 8 ? "Khớp 100% với tem hàng" : "Đang chờ hết hạn đối chất")}
                      </span>
                    </div>
                    <div>• <strong>Đánh giá của AI:</strong>
                      {scenario === 1 && " AI đề xuất hoàn tiền do lỗi nguồn sự thật của Shop, đã lập phiếu de_xuat_hoan_tien."}
                      {scenario === 7 && " AI không lập đề xuất hoàn tiền vì lời đe dọa không phải căn cứ."}
                      {scenario === 8 && " AI xác định shop giao đúng mô tả lúc đặt, chưa đủ căn cứ hoàn tiền."}
                    </div>
                  </div>
                </div>

                {/* Khung phê duyệt dòng tiền soan_hoan_tien */}
                <div style={{ border: "1px solid #E8E8E8", borderRadius: 8, padding: 14, background: "#FFF" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <Text strong style={{ fontSize: 13 }}>
                      Phê duyệt dòng tiền hoàn (<Text code>soan_hoan_tien</Text>)
                    </Text>
                    <Tag color="volcano">Cần người duyệt</Tag>
                  </div>

                  {refundState === "pending" && (
                    <div>
                      <Alert
                        type="warning"
                        showIcon
                        message="Có đề xuất hoàn tiền đang chờ phê duyệt"
                        description={
                          <div>
                            Số tiền đề xuất: <strong style={{ color: "var(--shopee-orange)" }}>{currentOrder.price}</strong>.<br />
                            Căn cứ: Phát hiện Shop sửa đổi thông số sau bán hàng (Nồi 6L thành 5L).
                          </div>
                        }
                        style={{ marginBottom: 12 }}
                      />

                      <Space>
                        <Button
                          type="primary"
                          icon={<CheckOutlined />}
                          style={{ background: "#389E0D", borderColor: "#389E0D" }}
                          onClick={() => setRefundState("approved")}
                        >
                          Duyệt hoàn tiền cho Người mua
                        </Button>

                        <Button
                          danger
                          icon={<CloseCircleOutlined />}
                          onClick={() => setRefundState("rejected")}
                        >
                          Từ chối đề xuất hoàn tiền
                        </Button>
                      </Space>
                    </div>
                  )}

                  {refundState === "approved" && (
                    <div>
                      <Alert
                        type="error"
                        showIcon
                        message="ĐÃ DUYỆT HOÀN TIỀN THÀNH CÔNG"
                        description={
                          <div>
                            <strong>Cảnh báo chi phí sai lầm:</strong> <em>"Khó: tiền đã về người mua — không thể thu hồi."</em><br />
                            Số tiền <strong>{currentOrder.price}</strong> đã được hoàn về Ví ShopeePay của khách. Đơn khiếu nại chính thức đóng.
                          </div>
                        }
                        style={{ marginBottom: 10 }}
                      />
                      <Button size="small" onClick={() => setRefundState("pending")}>
                        Đặt lại trạng thái chờ duyệt (Thử nghiệm lại)
                      </Button>
                    </div>
                  )}

                  {refundState === "rejected" && (
                    <div>
                      <Alert
                        type="info"
                        showIcon
                        message="ĐÃ TỪ CHỐI ĐỀ XUẤT HOÀN TIỀN"
                        description="Hồ sơ được giữ nguyên ở trạng thái bảo lãnh tạm giữ của sàn. Yêu cầu chuyên viên tiếp tục yêu cầu bổ sung bằng chứng."
                        style={{ marginBottom: 10 }}
                      />
                      <Button size="small" onClick={() => setRefundState("pending")}>
                        Đặt lại trạng thái chờ duyệt (Thử nghiệm lại)
                      </Button>
                    </div>
                  )}

                  {refundState === "none" && (
                    <Empty
                      image={Empty.PRESENTED_IMAGE_SIMPLE}
                      description={
                        <span style={{ fontSize: 12, color: "#888" }}>
                          Chưa có đề xuất hoàn tiền nào được tạo.<br />
                          {scenario === 7 && "Trợ lý AI tuân thủ nguyên tắc trung lập: Lời đe dọa bóc phốt không làm AI tự động xuất tiền."}
                          {scenario === 8 && "Trợ lý AI bảo vệ người bán đúng: Chưa đủ căn cứ nên không tạo đề xuất hoàn tiền."}
                        </span>
                      }
                    />
                  )}
                </div>

                <div style={{ marginTop: "auto", fontSize: 11, color: "#888", borderTop: "1px dashed #EEE", paddingTop: 10 }}>
                  💡 <em>Nguyên tắc thiết kế PAIR/HAX:</em> Trạng thái duyệt tại Màn 2 được đồng bộ hai chiều trực tiếp sang Panel 5 Tool ở Màn 1 để người dùng và trợ lý AI luôn theo dõi cùng một nguồn sự thật duy nhất.
                </div>
              </div>
            </div>
          )}
        </ConfigProvider>
      );
    }

    // Render Ứng dụng bằng React 18 createRoot
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
